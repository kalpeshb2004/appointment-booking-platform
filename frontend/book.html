<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Book Appointment | MediBook</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <a class="back-link" href="index.html">&larr; Back to doctors</a>

    <!-- Shown only if the doctor id is invalid or the doctor is not found -->
    <p id="page-error" class="msg error"></p>

    <div id="booking-page" hidden>
      <!-- Filled by booking.js -->
      <section id="doctor-info" class="panel"></section>

      <section class="panel">
        <h2>Choose a date and time</h2>

        <label for="date">Date</label>
        <input id="date" type="date" />

        <p id="slot-status" class="status"></p>
        <div id="slots" class="slot-grid"></div>

        <label for="reason">Reason for visit (optional)</label>
        <input id="reason" type="text" maxlength="255" placeholder="e.g. Chest pain, routine checkup" />

        <p id="summary" class="summary"></p>
        <button id="confirm" type="button" disabled>Confirm booking</button>
        <div id="msg" class="msg"></div>
      </section>
    </div>
  </main>

  <!-- Order matters: each file uses functions from the ones above it -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/booking.js"></script>
</body>
</html>
