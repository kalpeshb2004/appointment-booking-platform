<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Dashboard | MediBook</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header id="navbar"></header>

  <main class="container">
    <h1>Admin dashboard</h1>

    <div class="list-toolbar">
      <div>
        <label for="from">From</label>
        <input id="from" type="date" />
      </div>
      <div>
        <label for="to">To</label>
        <input id="to" type="date" />
      </div>
      <button id="reset" class="link-btn" type="button">Reset</button>
    </div>
    <p class="hint">Leave both dates empty to see all-time numbers.</p>

    <p id="status" class="status"></p>
    <div id="content" hidden>
      <h2 class="section-title">Overview</h2>
      <div id="totals" class="stats"></div>

      <h2 class="section-title">Rates</h2>
      <div id="rates" class="stats"></div>

      <h2 class="section-title">Top doctors by appointments</h2>
      <div id="by-doctor" class="table-wrap"></div>

      <h2 class="section-title">Appointments by department</h2>
      <div id="by-department" class="table-wrap"></div>
    </div>
  </main>

  <!-- Order matters: each file uses functions from the ones above it -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/navbar.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
