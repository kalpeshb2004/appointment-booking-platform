<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login | Hospital Appointments</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="auth-wrap">
    <div class="card">
      <h1>Login</h1>
      <p class="sub">Sign in to your account</p>

      <form id="login-form">
        <label for="username">Username</label>
        <input id="username" type="text" required autocomplete="username" />

        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" />

        <button type="submit">Login</button>
        <div id="msg" class="msg"></div>
      </form>

      <p class="switch">Don't have an account? <a href="register.html">Register</a></p>
    </div>
  </div>

  <!-- Order matters: api.js first, auth.js uses its functions -->
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
